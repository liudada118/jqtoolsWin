<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Three.js Blender-like Lighting</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body>
       <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
      }
    }
  </script>
    <script type="module">
       import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
    import { RectAreaLightUniformsLib } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/lights/RectAreaLightUniformsLib.js';

        const scene = new THREE.Scene();

        // —————————— Renderer ——————————
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // —————————— Camera ——————————
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);

        // —————————— Controls ——————————
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // —————————— HDRI 环境光（像 Blender World） ——————————
        new RGBELoader()
            .load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.environment = texture;
                scene.background = texture;
            });

        // —————————— Lights ——————————

        // 环境光（基础亮度）
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));

        // 平行光（像 Blender Sun）
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(5, 8, 2);
        sun.castShadow = true;
        sun.shadow.radius = 8;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 20;
        sun.shadow.camera.left = -10;
        sun.shadow.camera.right = 10;
        sun.shadow.camera.top = 10;
        sun.shadow.camera.bottom = -10;
        scene.add(sun);

        // 聚光灯（加强重点光照）
        const spot = new THREE.SpotLight(0xffffff, 2);
        spot.position.set(-2, 6, 4);
        spot.angle = Math.PI / 6;
        spot.penumbra = 0.4;
        spot.castShadow = true;
        spot.shadow.mapSize.set(2048, 2048);
        scene.add(spot);

        // —————————— Objects ——————————
        const geometry = new THREE.TorusKnotGeometry(1, 0.4, 256, 64);
        const material = new THREE.MeshStandardMaterial({ metalness: 0.6, roughness: 0.4 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        scene.add(mesh);

        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x202020, roughness: 0.6 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        const MODEL_URL = "./seat.glb";
        const loader = new GLTFLoader();
        let model = null;

        loader.load(
            MODEL_URL,
            (gltf) => {
                model = gltf.scene;
                scene.add(model);

                // 打开阴影
                model.traverse((o) => {
                    if (!o.isMesh) return;
                    o.castShadow = true;
                    o.receiveShadow = true;
                    // 若发现贴图发灰：通常是贴图色彩空间不对，但 glTF 一般没问题
                    // 如果你自己处理过纹理，可以在这里强制：
                    // if (o.material?.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
                });

                // 让相机/控制器自动对准模型
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                const center = new THREE.Vector3();
                box.getSize(size);
                box.getCenter(center);

                controls.target.copy(center);

                // 相机距离：按模型尺寸自适应
                const maxDim = Math.max(size.x, size.y, size.z);
                const dist = maxDim * 1.6;
                camera.position.set(center.x, center.y + maxDim * 0.6, center.z + dist);
                camera.near = Math.max(0.1, dist / 1000);
                camera.far = dist * 20;
                camera.updateProjectionMatrix();

                console.log("Model size:", size, "center:", center);
            },
            (xhr) => {
                if (xhr.total) console.log(`Loading: ${((xhr.loaded / xhr.total) * 100).toFixed(1)}%`);
            },
            (err) => {
                console.error("模型加载失败：", err);
            }
        );


        // —————————— Render Loop ——————————
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // —————————— Resize ——————————
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
